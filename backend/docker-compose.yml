services:
  db:
    image: postgres:16-alpine
    container_name: uspikh-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: uspikh
      POSTGRES_PASSWORD: ${DB_PASSWORD:-uspikh_dev}
      POSTGRES_DB: uspikh
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - uspikh-pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uspikh -d uspikh"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  uspikh-pgdata:
